# Файл для Render: https://render.com/docs/blueprint-spec
# Секреты (BOT_TOKEN, MODERATOR_ID) вводятся в дашборде и в репозиторий не попадают:
# sync: false означает «спросить у меня при создании сервиса», generateValue — «сгенерируй сам».
services:
  - type: web
    name: artmoto23-orders
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MODERATOR_ID
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_AUTO
        value: "1"
      - key: PUBLIC_URL
        sync: false
      - key: ALLOW_ORIGIN
        sync: false
      - key: DRY_RUN
        value: "0"
      - key: POLL
        value: "auto"
      - key: LOG_ORDERS
        value: "0"

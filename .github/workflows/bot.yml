# Бот заявок без хостинга: GitHub Actions сам забирает команды у Telegram
# и пересылает заявки модератору. Нужны только секреты репозитория
# (Settings → Secrets and variables → Actions → New repository secret):
#
#   BOT_TOKEN      — токен от @BotFather
#   MODERATOR_ID   — chat_id получателя заявок (узнать: напишите боту /id)
#   PUBLIC_URL     — необязательно: адрес сайта для приветствия бота
#
# Как это работает: каждый запуск слушает getUpdates до 4,5 минут (GitHub
# разрешает минимум 5 минут между cron-запусками), поэтому окно простоя
# между запусками — около минуты. Заявка, отправленная с сайта, попадает
# к модератору с задержкой обычно 1-6 минут.
#
# Важно:
#  • расписание работает только для файла в ветке по умолчанию (main);
#  • GitHub останавливает scheduled-запуски после 60 дней без активности
#    в репозитории — любой коммит или кнопка «Enable workflow» возвращает их;
#  • минуты Actions для публичных репозиториев бесплатны и не ограничены.

name: Бот заявок

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:        # кнопка «запустить сейчас» в разделе Actions

concurrency:
  group: telegram-bot       # два процесса с одним токеном конфликтуют (ошибка 409)
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Слушать Telegram и пересылать заявки
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MODERATOR_ID: ${{ secrets.MODERATOR_ID }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          FORWARD_TEXT: "1"
        run: node bot.js --once --budget 270
